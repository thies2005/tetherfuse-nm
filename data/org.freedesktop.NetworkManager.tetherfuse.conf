<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- TetherFuse NM VPN plugin: only NetworkManager (root) talks to it. -->
  <policy user="root">
    <allow own="org.freedesktop.NetworkManager.tetherfuse"/>
    <allow send_destination="org.freedesktop.NetworkManager.tetherfuse"/>
  </policy>
</busconfig>
